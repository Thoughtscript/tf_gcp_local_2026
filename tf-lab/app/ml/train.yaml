demo: linear            # linear | logistic | forecast
seed: 7
epochs: 5
learning_rate: 0.01
num_samples: 20000
output_dir: runs

data:
  dir: data
  num_shards: 8           # train shards: <demo>-train-00000-of-00008.tfrecord
  compression: GZIP       # "" | GZIP | ZLIB
  cycle_length: 4         # shards read in parallel (interleave)
  shuffle_buffer: 4096

batch:
  per_replica_batch_size: 64   # global = per_replica * num_replicas
  drop_remainder: true

distribution:
  strategy: auto          # auto | none | mirrored | multiworker
  gpus: null              # null = all visible, or a list e.g. [0, 1]
  all_reduce: nccl        # nccl | hierarchical_copy | reduce_to_one (mirrored on GPUs)
  virtual_devices: 0      # >1 splits the CPU into N logical devices to test the mirrored path

memory:
  pin: true               # single GPU: stage batches in device memory via prefetch_to_device
  prefetch: auto          # auto | integer
  gpu_memory_growth: true
  gpu_memory_limit_mb: null   # hard cap per GPU; takes precedence over growth
  private_threadpool: 0   # tf.data private threadpool size, 0 = default

forecast:
  window: 24
  horizon: 1
